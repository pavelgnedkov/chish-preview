name: Redeploy built preview

on:
  push:
    branches: [main]
    paths: [".github/workflows/redeploy.yml", "fix_names.py", "patch_site.py"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  repack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 42641992271
          github-token: ${{ github.token }}
          path: art
      - name: Unpack and clean
        run: |
          mkdir site && tar -xf art/artifact.tar -C site
          echo "files: $(find site -type f | wc -l)  size: $(du -sh site | cut -f1)"
          python3 patch_site.py site
          python3 fix_names.py site
          echo "files after: $(find site -type f | wc -l)  size: $(du -sh site | cut -f1)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: repack
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
